<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Tag - Form</title>
  </head>
  <body>
    <form>
      <h2>Basic Input Tag</h2>
      <label for="">Enter First Name : </label>
      <input type="text" placeholder="Enter First Name" /><br /><br />

      <label for="">Enter Last Name : </label>
      <input type="text" placeholder="Enter Last Name" /><br /><br />

      <label>Enter Your Email :</label>
      <input type="email" placeholder="Email" /><br /><br />

      <label>Enter Your Password : </label>
      <input type="password" />
      <br />
      <br />
      <label>Enter DOB :</label>
      <input type="Date" />
      <br />
      <br />
      <label>Enter Month :</label>
      <input type="month" />
      <br />
      <br />
      <label>Enter Week :</label>
      <input type="week" />
      <br />
      <br />
      <label>Enter Time :</label>
      <input type="time" />
      <br />
      <br />
      <label>Enter Date and Time :</label>
      <input type="datetime-local" />
      <br />
      <br />
      <label>Select Range :</label>
      <input type="range" />
      <br />
      <br />
      <label>Upload Your CV:</label>
      <input type="file" multiple />
      <br />
      <br />
      <label>Select Your Favourite color </label>
      <input type="color" />
      <br />
      <br />
      <label>Enter Your Age :</label>
      <input type="number" />
      <br />
      <br />
      <label>Enter your Phone number :</label>
      <input type="tel" />
      <br />
      <br />
      <label>Enter to Search:</label>
      <input type="search" placeholder="Search here" />
      <br />
      <br />
      <label>Enter URL:</label>
      <input type="url" placeholder="https://google.com" />
      <br />
      <br />
      <label>Chose Your Cities:</label>
      <input type="checkbox" />Kolhapur 
      <input type="checkbox" />Pune
      <input type="checkbox" />Mumbai 
      <input type="checkbox" />Satara
      <input type="checkbox" />Nashik <br /><br />
      <label>Select Your Gender :</label>
      <br><br>
      <input type="radio" name="Gender"/>Male 
      <input type="radio" name="Gender"/>Female
      <input type="radio" name="Gender"/>Other
      <br><br>

      <label>Select Your Favourite Sweet Dish :</label>
      <select>
        <option value="">choose...</option>
        <option value="">Gulabjam</option>
        <option value="">Rasmalai</option>
        <option value="">Shrikhand</option>
        <option value="">Kajukatli</option>
      </select>
      <br><br>
      <label>Enter Your Address :</label><br>
      <textarea rows="5" cols="40"></textarea><br><br>
      <input type="submit" value="submit">
      <input type="button" value="submit">
      <input type="reset"  value="reset">

    </form>

    <fieldset>
      <legend>Contact Form</legend>
      <form>
        <label for="">Enter Your Full Name : </label>
      <input type="text" placeholder="Enter First Name" /><br><br>

       <label for="">Enter Your Mobile No : </label>
      <input type="number" />
       <label for="">Enter alternative Mobile No : </label>
        <input type="number" /><br><br>

       <label for="">Enter Your Email : </label>
      <input type="text">
        <br><br>
        
       <label for="">Message : </label><br>
        <textarea rows="5" cols="40"></textarea>
      <br>
      <button>Submit</button>
      </form>
    </fieldset>
  </body>
</html>
